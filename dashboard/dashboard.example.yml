# Werkregie-Dashboard — copy to ~/.config/werkregie/dashboard.yml
# (or pass --config FILE / WERKREGIE_DASHBOARD_CONFIG). Mode `local`; for server and relay see the other examples.
port: 4747
windowHours: 168          # how far back the backend collects the history

claude:
  enabled: true           # ~/.config/Claude/claude-code-sessions + ~/.claude/sessions
codex:
  enabled: true           # ~/.codex/state_5.sqlite + rollout files
  includeSubagents: false

# any number of Werkator instances; the API is read anonymously
werkators:
  - name: javagil
    url: https://werkator.example.org
  - name: other
    url: http://localhost:18090
    hint: "tunnel: tools/remote --env-file .env.other port-forward start"

# werkrevisor's statistics service: the overview shows its review costs
werkrevisors:
  - name: javagil
    url: https://werkrevisor.example.org

# any number of Gitea instances; the token needs read access only
giteas:
  - name: javagil
    url: https://git.example.org
    teaLogin: javagil       # token of this login in ~/.config/tea/config.yml
    pullRequests: all       # all open PRs visible to the user
  - name: company
    url: https://gitea.example.com
    tokenEnv: WERKREGIE_TOKEN_COMPANY   # or token: <token>
    pullRequests: mine      # created by, assigned to or review requested from the user

# Matrix with your own account (modes local and relay); sign in once with `werkregie-dashboard matrix login`
# matrix:
#   homeserver: example.org       # server name or base URL; no default
#   rooms:                        # every message of these rooms; direct messages and mentions show anyway
#     - "!roomid:example.org"
#   link: matrix.to               # or element / io.element.desktop for Element Desktop

# task boards with what is assigned to you (modes local and server); only type taiga so far
# taskboards:
#   - name: team
#     type: taiga
#     url: https://taiga.example.org        # the web pages; the API is found in their conf.json
#     # apiUrl: https://taiga-api.example.org/api/v1   # only where conf.json does not tell it
#     usernameEnv: WERKREGIE_TAIGA_USER     # or username: <name>
#     passwordEnv: WERKREGIE_TAIGA_PASSWORD # never the password itself
#     projects: [shop, docs]                # project slugs, as in the address of a project
#     statuses:                             # most important first; a list holds equal names
#       - [In Arbeit, In Progress]
#       - Bereit
#       - [Neu, New]
#     hiddenStatuses: [Erledigt, Verworfen] # open in Taiga, hidden until the page shows them
