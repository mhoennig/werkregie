<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Übersicht — Werkregie</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/werkregie.css">
<!-- The reader's light/dark choice, applied before the first paint, as in Werkator (RFC 0003). -->
<script>try{var t=localStorage.getItem("werkregie-theme");if(t==="dark"||t==="light"){document.documentElement.dataset.theme=t;}}catch(e){}</script>
</head>
<body>

<header class="site-header">
    <div class="site-header-inner">
        <a class="brand" href="/" aria-label="Übersicht neu laden">
            <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><path d="M8 16h48M8 32h30M8 48h16"/><circle cx="47" cy="48" r="7"/></svg>
            <span>Werkregie</span>
        </a>
        <nav class="site-nav" aria-label="Dashboard">
            <span class="current nav-item"><span class="icon icon-home"></span><span class="nav-label">Übersicht</span></span>
            <span id="live-indicator" class="status-unknown" title="Verbindung zum Backend">…</span>
            <button id="theme-button" class="icon-button" type="button"><span class="icon icon-theme"></span></button>
            <button id="reload-button" class="icon-button reload-button" type="button" title="Neu laden" aria-label="Neu laden"><span class="icon icon-restart"></span></button>
        </nav>
    </div>
</header>

<main>
    <!-- one chip per data source, like Werkator's repository line -->
    <div id="source-line" class="repo-line"></div>
    <div class="view-head">
        <h1>Übersicht</h1>
        <span class="view-explanation">was gerade läuft und was zuletzt geschah</span>
        <span id="view-meta" class="view-meta"></span>
    </div>
    <div id="source-banner" class="watcher-banner" role="status" hidden></div>

    <div class="filters">
        <div id="source-chips" class="chips" aria-label="Quellen"></div>
        <!-- the project filter: a combobox whose list narrows to the projects containing the typed text -->
        <div class="combo">
            <input id="project" class="control combo-input" type="text" placeholder="alle Projekte" autocomplete="off" spellcheck="false"
                   role="combobox" aria-label="Projekt" aria-autocomplete="list" aria-expanded="false" aria-controls="project-list">
            <button id="project-clear" class="combo-clear" type="button" title="Projektfilter löschen" aria-label="Projektfilter löschen" hidden><span class="icon icon-close"></span></button>
            <ul id="project-list" class="combo-list" role="listbox" aria-label="Projekte" hidden></ul>
        </div>
        <select id="window" class="control" aria-label="Zeitraum">
            <option value="8">8 Stunden</option>
            <option value="24">24 Stunden</option>
            <option value="72">3 Tage</option>
            <option value="168">7 Tage</option>
        </select>
        <input id="search" class="control control-search" type="search" placeholder="Suchen …" aria-label="Suchen">
    </div>

    <div class="board">
        <section class="panel">
            <h2><span class="panel-title">Läuft jetzt <span id="running-sources" class="panel-sources"></span></span><em id="running-count"></em></h2>
            <div id="running" class="panel-body"></div>
            <button class="panel-more" type="button" data-panel="running" hidden></button>
        </section>
        <div class="board-pair">
            <section class="panel">
                <h2><span class="panel-title">Offene Sessions <span id="sessions-sources" class="panel-sources"></span></span><em id="sessions-count"></em></h2>
                <div id="sessions" class="panel-body"></div>
            <button class="panel-more" type="button" data-panel="sessions" hidden></button>
            </section>
            <section class="panel">
                <h2><span class="panel-title">Offene Pull Requests <span id="prs-sources" class="panel-sources"></span></span><em id="prs-count"></em></h2>
                <div id="prs" class="panel-body"></div>
            <button class="panel-more" type="button" data-panel="prs" hidden></button>
            </section>
        </div>
        <section class="panel">
            <h2><span class="panel-title">Verlauf <span id="recent-sources" class="panel-sources"></span></span><em id="recent-count"></em></h2>
            <div id="recent" class="panel-body"></div>
            <button class="panel-more" type="button" data-panel="recent" hidden></button>
        </section>
    </div>
</main>

<footer class="site-footer">
    <span>
        <strong>Werkregie</strong>
        <span id="version" class="version"></span>
        · © 2026 <a href="https://michael.hoennig.de" target="_blank" rel="noopener noreferrer">Michael Hönnig</a>
    </span>
    <span class="site-footer-links">
        <span>nur lokal, nur lesend</span>
    </span>
</footer>

<script>
const SOURCES = { claude: "Claude", codex: "Codex", werkator: "Werkator", werkrevisor: "werkrevisor", gitea: "Gitea" };

// Werkator's status classes: accent for good and running, clay for failed, amber for timeouts,
// an outlined dot for waiting, ghost for everything that is over without a verdict
const STATUS = {
    busy: ["running", "arbeitet"], running: ["running", "läuft"],
    pending: ["pending", "wartet"], queued: ["pending", "wartet"], idle: ["pending", "bereit"], open: ["pending", "offen"],
    success: ["success", "erfolgreich"], done: ["success", "fertig"],
    failure: ["failed", "fehler"], failed: ["failed", "fehler"], error: ["failed", "fehler"],
    timed_out: ["timed_out", "timeout"],
    interrupted: ["unknown", "abgebrochen"], closed: ["unknown", "beendet"], archived: ["unknown", "archiviert"],
    stale: ["unknown", "veraltet"], draft: ["unknown", "entwurf"],
};
const TAG = {
    pending: "tag-run", running: "tag-run", success: "tag-ok", green: "tag-ok",
    yellow: "tag-warn", warning: "tag-warn", orange: "tag-bad", red: "tag-bad", failure: "tag-bad", error: "tag-bad",
};

const THEME_KEY = "werkregie-theme";
const SETTINGS_KEY = "werkregie-settings";
const storage = (() => { try { return window.localStorage; } catch (e) { return null; } })();
const saved = (() => { try { return JSON.parse(storage?.getItem(SETTINGS_KEY) || "{}"); } catch (e) { return {}; } })();
const state = { data: null, hidden: new Set(saved.hidden || []), expanded: new Set(saved.expanded || []), project: saved.project || "", windowHours: saved.windowHours || 24, search: "" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function persist() {
    try { storage?.setItem(SETTINGS_KEY, JSON.stringify({ hidden: [...state.hidden], expanded: [...state.expanded], project: state.project, windowHours: state.windowHours })); } catch (e) {}
}

function ago(iso) {
    const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
    if (s < 60) return "jetzt";
    if (s < 3600) return `${Math.floor(s / 60)} min`;
    if (s < 86400) return `${Math.floor(s / 3600)} h`;
    return `${Math.floor(s / 86400)} d`;
}
const clock = (iso, seconds) => new Date(iso).toLocaleTimeString("de-DE", seconds ? {} : { hour: "2-digit", minute: "2-digit" });
function dayLabel(iso) {
    const d = new Date(iso), today = new Date();
    const diff = Math.round((new Date(today.toDateString()) - new Date(d.toDateString())) / 86400000);
    if (diff === 0) return "Heute";
    if (diff === 1) return "Gestern";
    return d.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });
}

function statusHtml(item) {
    if (item.kind === "activity") return "";
    const [cls, word] = STATUS[item.state] || ["unknown", item.state.replaceAll("_", " ")];
    return `<span class="status status-${cls}">${esc(word)}</span>`;
}

function tagHtml(badge) {
    const cls = TAG[(badge.state || "").toLowerCase()] || "";
    const attrs = `class="tag ${cls}"${badge.title ? ` title="${esc(badge.title)}"` : ""}`;
    return badge.url
        ? `<a ${attrs} href="${esc(badge.url)}" target="_blank" rel="noopener">${esc(badge.label)}</a>`
        : `<span ${attrs}>${esc(badge.label)}</span>`;
}

function row(item, timeMode) {
    const title = item.url
        ? `<a class="title" href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.title)}</a>`
        : `<span class="title">${esc(item.title)}</span>`;
    const failed = (STATUS[item.state] || [])[0] === "failed" && item.kind !== "pr";
    const classes = ["row", item.section === "RUNNING" ? "is-running" : "", failed ? "is-failed" : ""].join(" ");
    const when = item.time ? (timeMode === "clock" ? clock(item.time) : ago(item.time)) : "";
    const copy = item.command
        ? `<button class="copy-button" type="button" data-cmd="${esc(item.command)}" title="Resume-Befehl kopieren: ${esc(item.command)}" aria-label="Resume-Befehl kopieren"><span class="icon icon-copy"></span></button>`
        : "";
    return `<div class="${classes}">
        <div class="when" title="${esc(item.time ? new Date(item.time).toLocaleString("de-DE") : "")}">${esc(when)}</div>
        <div class="what">
            ${title}
            <div class="meta">
                <span class="origin">${esc(SOURCES[item.source] || item.source)} · ${esc(item.origin)}</span>
                ${item.project ? `<span class="project">${esc(item.project)}</span>` : ""}
                ${item.detail ? `<span class="detail">${esc(item.detail)}</span>` : ""}
            </div>
        </div>
        <div class="aside">${(item.badges || []).map(tagHtml).join("")}${statusHtml(item)}${copy}</div>
    </div>`;
}

function fill(id, items, empty, countWord) {
    $(id).innerHTML = items.length ? items.map((i) => row(i)).join("") : `<div class="empty">${empty}</div>`;
    $(`${id}-count`).textContent = items.length ? `${items.length} ${countWord}` : "";
    clamp(id);
}

// ---- each panel shows three and a half rows, the half one fading out, until it is opened ----
const VISIBLE_ROWS = 3;

/** The height of the closed panel: down to the middle of the first hidden row. */
function clampHeight(body) {
    const rows = body.querySelectorAll(".row");
    if (rows.length <= VISIBLE_ROWS) return null;
    const half = rows[VISIBLE_ROWS];
    return { height: half.offsetTop + half.offsetHeight / 2, fade: half.offsetHeight / 2, total: rows.length };
}

function clamp(id) {
    const body = $(id);
    const button = document.querySelector(`.panel-more[data-panel="${id}"]`);
    const closed = clampHeight(body);
    button.hidden = closed === null;
    if (closed === null) {
        body.classList.remove("is-clamped");
        body.style.maxHeight = "";
        return;
    }
    const open = state.expanded.has(id);
    button.innerHTML = open
        ? `Weniger anzeigen <span class="icon icon-chevron is-open"></span>`
        : `Alle ${closed.total} anzeigen <span class="icon icon-chevron"></span>`;
    button.setAttribute("aria-expanded", String(open));
    body.classList.toggle("is-clamped", !open);
    body.style.setProperty("--fade", `${closed.fade}px`);
    // while sliding open the height is set by toggle(); afterwards an open panel has no limit
    if (!body.classList.contains("is-sliding")) body.style.maxHeight = open ? "" : `${closed.height}px`;
}

function toggle(id) {
    const body = $(id);
    const closed = clampHeight(body);
    if (!closed) return;
    const opening = !state.expanded.has(id);
    opening ? state.expanded.add(id) : state.expanded.delete(id);
    persist();
    // slide between the two heights; max-height cannot animate to or from "none"
    body.classList.add("is-sliding");
    body.style.maxHeight = `${opening ? closed.height : body.scrollHeight}px`;
    void body.offsetHeight;
    body.style.maxHeight = `${opening ? body.scrollHeight : closed.height}px`;
    const done = () => { body.classList.remove("is-sliding"); clamp(id); };
    body.addEventListener("transitionend", done, { once: true });
    setTimeout(() => body.classList.contains("is-sliding") && done(), 600);
    clamp(id);
}

// ---- which tools feed which panel; the heading names those configured and not filtered out ----
const PANEL_SOURCES = {
    running: ["claude", "codex", "werkator", "werkrevisor"],
    sessions: ["claude"],
    prs: ["gitea"],
    recent: ["claude", "codex", "werkator", "werkrevisor", "gitea"],
};
const TOOL_NAMES = { claude: "Claude Code", codex: "Codex", werkator: "Werkator", werkrevisor: "werkrevisor", gitea: "Gitea" };

/** "Werkator javagil, vm4006": a tool with its configured instances, or null when none is configured. */
function toolLabel(tool, sources) {
    // werkrevisor runs are the @ai-review builds of the Werkator instances
    const kind = tool === "werkrevisor" ? "werkator" : tool;
    const instances = sources.filter((s) => s.id.split(":")[0] === kind).map((s) => s.id.split(":")[1]).filter(Boolean);
    if (!sources.some((s) => s.id.split(":")[0] === kind)) return null;
    return tool === "werkrevisor" || instances.length === 0
        ? TOOL_NAMES[tool]
        : `${TOOL_NAMES[tool]} ${instances.join(", ")}`;
}

function renderPanelSources() {
    for (const [panel, tools] of Object.entries(PANEL_SOURCES)) {
        const labels = tools.filter((tool) => !state.hidden.has(tool)).map((tool) => toolLabel(tool, state.data.sources)).filter(Boolean);
        let text = labels.join(" · ");
        if (panel === "prs" && labels.length) text += " — mit Commit-Status, z. B. Werkator, werkrevisor";
        $(`${panel}-sources`).textContent = text ? `aus ${text}` : "keine Quelle ausgewählt";
    }
}

function render() {
    const data = state.data;
    if (!data) return;
    renderPanelSources();
    const needle = state.search.toLowerCase();
    const since = Date.now() - state.windowHours * 3600 * 1000;
    const visible = data.items.filter((i) =>
        !state.hidden.has(i.source) &&
        (!state.project || i.project === state.project) &&
        (!needle || `${i.title} ${i.project} ${i.detail} ${i.origin}`.toLowerCase().includes(needle)));

    fill("running", visible.filter((i) => i.section === "RUNNING"), "Nichts in Arbeit.", "aktiv");
    fill("sessions", visible.filter((i) => i.section === "OPEN" && i.kind !== "pr"), "Keine offenen Sessions.", "bereit");
    fill("prs", visible.filter((i) => i.kind === "pr"), "Keine offenen Pull Requests.", "offen");

    const recent = visible.filter((i) => i.section === "RECENT" && i.time && Date.parse(i.time) >= since);
    let html = "", day = null;
    for (const item of recent) {
        const label = dayLabel(item.time);
        if (label !== day) { html += `<div class="day">${esc(label)}</div>`; day = label; }
        html += row(item, "clock");
    }
    $("recent").innerHTML = html || `<div class="empty">Nichts im gewählten Zeitraum.</div>`;
    $("recent-count").textContent = `${recent.length} Einträge`;
    clamp("recent");
}

function renderChrome() {
    const data = state.data;
    $("view-meta").textContent = `Stand ${clock(data.generatedAt, true)}`;
    $("version").textContent = data.version ? `v${data.version}` : "";
    $("source-line").innerHTML = data.sources.map((s) => {
        const tag = s.url ? "a" : "span";
        const href = s.url ? ` href="${esc(s.url)}" target="_blank" rel="noopener"` : "";
        const level = s.ok ? (s.message ? " repo-chip-warn" : "") : " repo-chip-bad";
        const dot = s.ok ? (s.message ? "timed_out" : "success") : "failed";
        const title = s.message || `${s.count} Einträge`;
        return `<${tag} class="repo-chip${level}"${href} title="${esc(title)}"><span class="status status-${dot}"></span><span>${esc(s.label)}</span><small>${s.ok ? s.count : "Fehler"}</small></${tag}>`;
    }).join("");

    const problems = data.sources.filter((s) => !s.ok || s.message);
    const banner = $("source-banner");
    banner.hidden = problems.length === 0;
    banner.innerHTML = `<strong>Quellen</strong> ` + problems.map((s) => `${esc(s.label)}: ${esc(s.message)}`).join(" · ");

    const counts = new Map();
    data.items.forEach((i) => i.project && counts.set(i.project, (counts.get(i.project) || 0) + 1));
    projectCombo.setProjects([...counts].sort(([a], [b]) => a.localeCompare(b)));
}

function renderSourceChips() {
    $("source-chips").innerHTML = Object.entries(SOURCES).map(([key, label]) =>
        `<button class="chip${state.hidden.has(key) ? "" : " is-active"}" type="button" data-source="${key}" aria-pressed="${!state.hidden.has(key)}">${esc(label)}</button>`).join("");
}

function setLive(ok) {
    const indicator = $("live-indicator");
    indicator.className = ok ? "status-success" : "status-error";
    indicator.textContent = ok ? "live" : "offline";
}

async function load() {
    try {
        const response = await fetch("/api/dashboard", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        state.data = await response.json();
        setLive(true);
        renderChrome();
        render();
    } catch (e) {
        setLive(false);
    }
}

// ---- the project filter: typing narrows the list to projects containing the text ----
const projectCombo = (() => {
    const input = $("project"), list = $("project-list"), clear = $("project-clear");
    let projects = [], matches = [], active = -1;

    function highlight(name, query) {
        const at = query ? name.toLowerCase().indexOf(query) : -1;
        if (at < 0) return esc(name);
        return esc(name.slice(0, at)) + `<mark>${esc(name.slice(at, at + query.length))}</mark>` + esc(name.slice(at + query.length));
    }

    function open() {
        const query = input.value.trim().toLowerCase();
        // the input still shows the chosen project: offer all, not just that one
        const filter = query && input.value !== state.project ? query : "";
        matches = projects.filter(([name]) => name.toLowerCase().includes(filter));
        active = Math.max(0, matches.findIndex(([name]) => name === state.project));
        list.innerHTML = matches.length
            ? matches.map(([name, count], index) =>
                `<li role="option" id="project-option-${index}" data-index="${index}" class="${index === active ? "is-active" : ""}${name === state.project ? " is-selected" : ""}"` +
                ` aria-selected="${name === state.project}"><span>${highlight(name, filter)}</span><small>${count}</small></li>`).join("")
            : `<li class="combo-empty">kein Projekt enthält „${esc(input.value.trim())}“</li>`;
        list.hidden = false;
        input.setAttribute("aria-expanded", "true");
        markActive();
    }

    function close() {
        list.hidden = true;
        input.setAttribute("aria-expanded", "false");
        input.removeAttribute("aria-activedescendant");
    }

    function markActive() {
        list.querySelectorAll("[data-index]").forEach((li) => li.classList.toggle("is-active", Number(li.dataset.index) === active));
        const current = list.querySelector(`[data-index="${active}"]`);
        current?.scrollIntoView({ block: "nearest" });
        current ? input.setAttribute("aria-activedescendant", current.id) : input.removeAttribute("aria-activedescendant");
    }

    function choose(project) {
        state.project = project;
        input.value = project;
        clear.hidden = !project;
        persist();
        render();
        close();
    }

    input.addEventListener("focus", () => { input.select(); open(); });
    input.addEventListener("input", () => {
        if (!input.value.trim() && state.project) choose("");
        open();
    });
    input.addEventListener("keydown", (e) => {
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            if (list.hidden) return open();
            if (matches.length) active = (active + (e.key === "ArrowDown" ? 1 : -1) + matches.length) % matches.length;
            markActive();
        } else if (e.key === "Enter") {
            e.preventDefault();
            if (!list.hidden && matches[active]) choose(matches[active][0]);
        } else if (e.key === "Escape") {
            input.value = state.project;
            close();
        }
    });
    // a click in the list must not blur the input first
    list.addEventListener("mousedown", (e) => e.preventDefault());
    list.addEventListener("click", (e) => {
        const li = e.target.closest("[data-index]");
        if (li) choose(matches[Number(li.dataset.index)][0]);
    });
    input.addEventListener("blur", () => { input.value = state.project; close(); });
    clear.addEventListener("click", () => choose(""));

    input.value = state.project;
    clear.hidden = !state.project;
    return {
        setProjects(next) {
            projects = next;
            if (!list.hidden) open();
        },
    };
})();

// ---- light or dark over the browser's preference, as in Werkator (RFC 0003) ----
function currentTheme() {
    if (document.documentElement.dataset.theme) return document.documentElement.dataset.theme;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function describeTheme() {
    const button = $("theme-button");
    button.title = currentTheme() === "dark" ? "Hell anzeigen" : "Dunkel anzeigen";
    button.setAttribute("aria-label", button.title);
}
$("theme-button").addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { storage?.setItem(THEME_KEY, next); } catch (e) {}
    describeTheme();
});
window.matchMedia?.("(prefers-color-scheme: dark)").addEventListener("change", describeTheme);
describeTheme();

$("reload-button").addEventListener("click", (e) => {
    const button = e.currentTarget;
    button.classList.remove("is-reloading");
    void button.offsetWidth;
    button.classList.add("is-reloading");
    load();
});
$("source-chips").addEventListener("click", (e) => {
    const chip = e.target.closest("[data-source]");
    if (!chip) return;
    const key = chip.dataset.source;
    state.hidden.has(key) ? state.hidden.delete(key) : state.hidden.add(key);
    persist(); renderSourceChips(); render();
});
document.querySelectorAll(".panel-more").forEach((button) =>
    button.addEventListener("click", () => toggle(button.dataset.panel)));
window.addEventListener("resize", () => ["running", "sessions", "prs", "recent"].forEach(clamp));
$("window").value = String(state.windowHours);
$("window").addEventListener("change", (e) => { state.windowHours = Number(e.target.value); persist(); render(); });
$("search").addEventListener("input", (e) => { state.search = e.target.value; render(); });
document.addEventListener("click", async (e) => {
    const button = e.target.closest(".copy-button");
    if (!button) return;
    try {
        await navigator.clipboard.writeText(button.dataset.cmd);
        button.classList.add("is-copied");
        setTimeout(() => button.classList.remove("is-copied"), 1500);
    } catch (error) {
        button.title = "Kopieren fehlgeschlagen";
    }
});

renderSourceChips();
load();
setInterval(() => { if (!document.hidden) load(); }, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
