# Werkregie-Dashboard in mode `relay` on a machine with coding agents.
windowHours: 168

claude:
  enabled: true
codex:
  enabled: true

# the active time of the sessions, from the time stamps of their transcripts
journal:
  gapMinutes: 15              # a longer pause between two entries splits the active time

# Matrix with your own account (modes local and relay); sign in once with `werkregie-dashboard matrix login`
# matrix:
#   homeserver: example.org       # server name or base URL; no default
#   rooms:                        # every message of these rooms; direct messages and mentions show anyway
#     - "!roomid:example.org"
#   link: matrix.to               # on the desktop; io.element.desktop or element opens Element Desktop, a phone gets matrix.to

relay:
  serverUrl: https://regie.example.org/
  tokenFile: ~/.config/werkregie/relay-token   # the server's access token, mode 0600; or token / tokenEnv
  # name: laptop                               # default: the host name
  intervalSeconds: 5
